services:
  elasticsetup:
    image: ${ELASTIC_IMAGE}
    volumes:
      - elastic-certs-data:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: elasticsearch\n"\
          "    dns:\n"\
          "      - elasticsearch\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: kibana\n"\
          "    dns:\n"\
          "      - kibana\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 \{\} \;;
        find . -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://elasticsearch:${ES_PORT_INTERNAL} | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://elasticsearch:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/elasticsearch/elasticsearch.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120
    env_file:
      - .env

  elasticsearch:
    depends_on:
      elasticsetup:
        condition: service_healthy
    image: ${ELASTIC_IMAGE}
    restart: unless-stopped
    labels:
      co.elastic.logs/module: elasticsearch
      traefik.frontend.priority: 1
      traefik.enable: true
      traefik.http.routers.elasticsearch.rule: "Host(`${ELASTIC_HOST}`)"
      traefik.http.routers.elasticsearch.entrypoints: web
      traefik.http.routers.elasticsearch_https.rule: "Host(`${ELASTIC_HOST}`)"
      traefik.http.routers.elasticsearch_https.tls: true
      traefik.http.routers.elasticsearch_https.entrypoints: websecure
      traefik.http.services.elasticsearch.loadbalancer.server.port: ${ES_PORT_INTERNAL}
      traefik.http.services.elasticsearch.loadbalancer.server.scheme: https
      traefik.http.services.elasticsearch.loadbalancer.passHostHeader: true
    volumes:
      - elastic-certs-data:/usr/share/elasticsearch/config/certs
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:${ES_PORT_INTERNAL}
    environment:
      - node.name=elasticsearch
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      - ELASTIC_PASSWORD
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    mem_limit: ${ES_MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:${ES_PORT_INTERNAL} | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: ${KIBANA_IMAGE}
    restart: unless-stopped
    labels:
      co.elastic.logs/module: kibana
      traefik.frontend.priority: 1
      traefik.enable: true
      traefik.http.routers.kibana.rule: "Host(`${KIBANA_HOST}`)"
      traefik.http.routers.kibana.entrypoints: web
      traefik.http.routers.kibana_https.rule: "Host(`${KIBANA_HOST}`)"
      traefik.http.routers.kibana_https.tls: true
      traefik.http.routers.kibana_https.entrypoints: websecure
      traefik.http.services.kibana.loadbalancer.server.port: ${KIBANA_PORT_INTERNAL}
      traefik.http.services.kibana.loadbalancer.passHostHeader: true
    volumes:
      - elastic-certs-data:/usr/share/kibana/config/certs
      - kibana-data:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT}:${KIBANA_PORT_INTERNAL}
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS
      - ELASTICSEARCH_USERNAME
      - ELASTICSEARCH_PASSWORD
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - XPACK_SECURITY_ENCRYPTIONKEY
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
      - XPACK_REPORTING_ENCRYPTIONKEY
    mem_limit: ${KB_MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  metricbeat:
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    image: ${METRICBEAT_IMAGE}
    restart: unless-stopped
    user: root
    volumes:
      - elastic-certs-data:/usr/share/metricbeat/certs
      - metricbeat-data:/usr/share/metricbeat/data
      - "./services/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro"
      - "/proc:/hostfs/proc:ro"
      - "/:/hostfs:ro"
    environment:
      - ELASTIC_USER
      - ELASTIC_PASSWORD
      - ELASTIC_HOSTS
      - KIBANA_HOSTS
      - LOGSTASH_HOSTS
    command:
      - --strict.perms=false

  filebeat:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: ${FILEBEAT_IMAGE}
    restart: unless-stopped
    user: root
    volumes:
      - elastic-certs-data:/usr/share/filebeat/certs
      - filebeat-data:/usr/share/filebeat/data
      - "./services/filebeat/ingest_data/:/usr/share/filebeat/ingest_data/"
      - "./services/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - ELASTIC_USER
      - ELASTIC_PASSWORD
      - ELASTIC_HOSTS
      - KIBANA_HOSTS
      - LOGSTASH_HOSTS
    command:
      - --strict.perms=false

  logstash:
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    image: ${LOGSTASH_IMAGE}
    restart: unless-stopped
    labels:
      co.elastic.logs/module: logstash
    user: root
    volumes:
      - elastic-certs-data:/usr/share/logstash/certs
      - logstash-data:/usr/share/logstash/data
      - "./services/logstash/ingest_data/:/usr/share/logstash/ingest_data/"
      - "./services/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"
    environment:
      - xpack.monitoring.enabled=false
      - ELASTIC_USER
      - ELASTIC_PASSWORD
      - ELASTIC_HOSTS

volumes:
  elastic-certs-data:
  elasticsearch-data:
  kibana-data:
  metricbeat-data:
  filebeat-data:
  logstash-data:

networks:
  default:
